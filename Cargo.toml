[package]
name = "ohioism-trade"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Trade Card control plane, shared MD, pro-rata coordinator, UK key fleet."
default-run = "trade-api"

[[bin]]
name = "trade-api"
path = "src/bin/trade-api.rs"

[[bin]]
name = "trade-coordinator"
path = "src/bin/trade-coordinator.rs"

[[bin]]
name = "trade-fleet"
path = "src/bin/trade-fleet.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
cookie = "0.18"
crossbeam-channel = "0.5"
dotenvy = "0.15"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
jsonwebtoken = "9"
mm-clob = { path = "../polymarket-15m-taker-bot/crates/clob" }
mm-engine = { path = "../polymarket-15m-taker-bot/crates/engine" }
mm-md = { path = "../polymarket-15m-taker-bot/crates/md" }
mongodb = { version = "2.8.2", default-features = false, features = ["tokio-runtime", "openssl-tls", "async-std-resolver"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "io-util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

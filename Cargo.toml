[package]
name = "ohioism-trade"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Trade Card control plane, shared MD, coordinator, live fleet."
default-run = "trade-api"

[workspace]
resolver = "2"
members = ["crates/engine", "crates/md", "crates/clob"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
publish = false

[workspace.dependencies]
mm-engine = { path = "crates/engine" }
mm-md = { path = "crates/md" }
mm-clob = { path = "crates/clob" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
tracing = "0.1"
hex = "0.4"
crossbeam-channel = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "http2"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
ureq = { version = "2.12", default-features = false, features = ["native-tls", "json"] }
native-tls = "0.2"
futures-util = "0.3"
url = "2"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
tiny-keccak = { version = "2", features = ["keccak"] }
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
socket2 = { version = "0.5", features = ["all"] }

[[bin]]
name = "trade-api"
path = "src/bin/trade-api.rs"

[[bin]]
name = "trade-coordinator"
path = "src/bin/trade-coordinator.rs"

[[bin]]
name = "trade-fleet"
path = "src/bin/trade-fleet.rs"

[dependencies]
aes-gcm = "0.10"
anyhow.workspace = true
argon2 = "0.5"
axum = { version = "0.8", features = ["macros"] }
base64.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
cookie = "0.18"
crossbeam-channel.workspace = true
dotenvy = "0.15"
futures-util.workspace = true
hex.workspace = true
hmac.workspace = true
jsonwebtoken = "9"
mm-clob.workspace = true
mm-engine.workspace = true
mm-md.workspace = true
mongodb = { version = "2.8.2", default-features = false, features = ["tokio-runtime", "openssl-tls", "async-std-resolver"] }
rand = "0.8"
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-http = { version = "0.6", features = ["trace"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
